{% extends 'base.html' %}

{% block title %}Password Changed - ResQGrid{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card card-resq text-center p-4">
                <i class="fa-solid fa-circle-check text-success fs-1 mb-3"></i>
                <h1 class="h4 fw-bold">Password Updated</h1>
                <p class="text-muted">Your account password has been changed successfully.</p>
                <a href="{% url 'dashboard' %}" class="btn btn-primary">Return to Dashboard</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
